<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Manika Goel</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F9FD;
    --ink:#0E1526;
    --ink-2:#5b6864;
    --teal:#1E6B67;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0E1526; --ink:#E4EEF9; --ink-2:#9aa8ad; --teal:#74ab97; }
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', -apple-system, "Segoe UI", sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px;
  }
  h1{
    font-family:'Fraunces', Georgia, serif;
    font-weight:400;
    font-size:1.9rem;
    letter-spacing:-.01em;
    margin:0 0 12px;
  }
  p{ color:var(--ink-2); margin:0 0 22px; font-size:.98rem; line-height:1.6; }
  a{ color:var(--teal); text-decoration:none; font-weight:500; }
  a:hover{ text-decoration:underline; }
</style>
</head>
<body>
  <div>
    <h1>Manika Goel</h1>
    <p>Mind Performance Coach &amp; Counselling Psychologist</p>
    <p><a href="https://dmit.manikagoel.com">dmit.manikagoel.com</a></p>
  </div>
</body>
</html>
