<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Manika Goel — Tools</title>
<style>
  :root {
    --bg: #f2f4f1;
    --surface: #ffffff;
    --ink: #1c2624;
    --ink-soft: #5b6864;
    --accent: #3e6b5c;
    --line: rgba(28, 38, 36, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141d1a;
      --surface: #1b2622;
      --ink: #edefea;
      --ink-soft: #a9b3ae;
      --accent: #74ab97;
      --line: rgba(237, 239, 234, 0.12);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  .page { max-width: 560px; margin: 0 auto; padding: 64px 24px; }
  h1 { font-family: Georgia, serif; font-weight: 400; font-size: 1.8rem; margin: 0 0 32px; }
  a.card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 12px;
    text-decoration: none;
    color: var(--ink);
  }
  a.card strong { display: block; margin-bottom: 4px; }
  a.card span { color: var(--ink-soft); font-size: 0.9rem; }
</style>
</head>
<body>
  <div class="page">
    <h1>Manika Goel</h1>
    <a class="card" href="/focus-challenge-hub-selfstart/">
      <strong>7-Day Focus Reset Challenge</strong>
      <span>Reusable daily-video hub — share this link with anyone new.</span>
    </a>
    <a class="card" href="/learning-style-discovery/">
      <strong>The Learning Style Discovery</strong>
      <span>A free mini-assessment for parents.</span>
    </a>
    <a class="card" href="/focus-challenge-hub/">
      <strong>Focus Reset Challenge — Original Batch</strong>
      <span>Reference copy for the first completed batch.</span>
    </a>
  </div>
</body>
</html>
